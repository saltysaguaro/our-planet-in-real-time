name: Probe GEOS aerosol data
on:
  push:
    branches: [render/northern-algeria-jul1-sep1-2026]
    paths:
      - '.github/workflows/probe-geos-aerosol.yml'
      - 'scripts/probe_geos_aerosol.py'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pydap
      - run: python scripts/probe_geos_aerosol.py
      - uses: actions/upload-artifact@v4
        with:
          name: geos-aerosol-probe
          path: build/geos-probe.txt
