name: Align BMNG July basemap to NASA SVS 5666

on:
  push:
    branches:
      - render/northern-algeria-20260701-20260901
    paths:
      - '.github/workflows/align-bmng-to-svs-5666.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip
          python -m pip install opencv-python-headless numpy pillow

      - name: Download the official NASA render and BMNG July basemap
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          curl --fail --location --retry 5 --retry-all-errors \
            -o build/source.mp4 \
            'https://svs.gsfc.nasa.gov/vis/a000000/a005600/a005666/SmokeIntensity_EuropeanWildfires_082426_1920x1080.mp4'
          curl --fail --location --retry 5 --retry-all-errors \
            -o build/bmng-july.jpg \
            'https://assets.science.nasa.gov/content/dam/science/esd/eo/images/bmng/bmng-topography-bathymetry/july/world.topo.bathy.200407.3x5400x2700.jpg'
          ffmpeg -hide_banner -loglevel error -y -ss 0 -i build/source.mp4 -frames:v 1 build/source-first.png

      - name: Estimate the equirectangular alignment
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee build/alignment.txt
          import cv2
          import numpy as np
          from pathlib import Path

          src_full = cv2.imread('build/source-first.png', cv2.IMREAD_COLOR)
          bmng = cv2.imread('build/bmng-july.jpg', cv2.IMREAD_COLOR)
          if src_full is None or bmng is None:
              raise RuntimeError('Could not read source imagery')

          # This is the exact scientific-map crop used by the previously delivered
          # northern-Algeria edition, before its information panels are restored.
          src = src_full[540:1080, 460:1420].copy()
          cv2.imwrite('build/source-map-crop.png', src)

          h, w = bmng.shape[:2]
          def xy(lon, lat):
              return ((lon + 180.0) / 360.0 * w, (90.0 - lat) / 180.0 * h)

          # Broad Mediterranean search window.
          x0, y0 = xy(-30, 60)
          x1, y1 = xy(50, 10)
          x0, x1, y0, y1 = map(int, (x0, x1, y0, y1))
          cand = bmng[y0:y1, x0:x1].copy()

          def prep(im):
              gray = cv2.cvtColor(im, cv2.COLOR_BGR2GRAY)
              gray = cv2.createCLAHE(clipLimit=2.0, tileGridSize=(8,8)).apply(gray)
              return gray

          sift = cv2.SIFT_create(nfeatures=12000, contrastThreshold=0.008, edgeThreshold=12)
          kp_s, des_s = sift.detectAndCompute(prep(src), None)
          kp_c, des_c = sift.detectAndCompute(prep(cand), None)
          if des_s is None or des_c is None:
              raise RuntimeError('SIFT found no descriptors')

          matches = cv2.BFMatcher(cv2.NORM_L2).knnMatch(des_c, des_s, k=2)
          good = [m for m,n in matches if m.distance < 0.72*n.distance]
          print('source keypoints:', len(kp_s))
          print('candidate keypoints:', len(kp_c))
          print('good matches:', len(good))
          if len(good) < 20:
              raise RuntimeError(f'Insufficient matches: {len(good)}')

          pts_b = np.float32([[kp_c[m.queryIdx].pt[0] + x0,
                               kp_c[m.queryIdx].pt[1] + y0] for m in good])
          pts_s = np.float32([kp_s[m.trainIdx].pt for m in good])
          H, inliers = cv2.findHomography(pts_b, pts_s, cv2.RANSAC, 5.0)
          if H is None:
              raise RuntimeError('Homography estimation failed')
          inlier_count = int(inliers.sum())
          print('inliers:', inlier_count, '/', len(good))
          print('H bmng->source:')
          print(H)

          aligned = cv2.warpPerspective(bmng, H, (src.shape[1], src.shape[0]), flags=cv2.INTER_LANCZOS)
          cv2.imwrite('build/bmng-aligned.png', aligned)
          blend = cv2.addWeighted(src, 0.5, aligned, 0.5, 0)
          cv2.imwrite('build/alignment-blend.png', blend)
          diff = cv2.absdiff(src, aligned)
          cv2.imwrite('build/alignment-difference.png', diff)

          Hinv = np.linalg.inv(H)
          corners = np.float32([[[0,0],[src.shape[1],0],[src.shape[1],src.shape[0]],[0,src.shape[0]]]])
          bc = cv2.perspectiveTransform(corners, Hinv)[0]
          print('output corners in BMNG pixels:')
          print(bc)
          for name,(xx,yy) in zip(['top-left','top-right','bottom-right','bottom-left'], bc):
              lon = xx / w * 360.0 - 180.0
              lat = 90.0 - yy / h * 180.0
              print(f'{name}: lon={lon:.6f}, lat={lat:.6f}')

          # Also fit the physically expected axis-aligned affine map using the
          # inlier correspondences. This removes tiny projective artifacts from
          # feature matching while retaining the inferred geographic window.
          keep = inliers.ravel().astype(bool)
          A, ain = cv2.estimateAffine2D(pts_b[keep], pts_s[keep], method=cv2.RANSAC,
                                       ransacReprojThreshold=4.0, maxIters=10000,
                                       confidence=0.999, refineIters=50)
          print('affine bmng->source:')
          print(A)
          if A is not None:
              aligned_a = cv2.warpAffine(bmng, A, (src.shape[1], src.shape[0]), flags=cv2.INTER_LANCZOS)
              cv2.imwrite('build/bmng-aligned-affine.png', aligned_a)
              cv2.imwrite('build/alignment-blend-affine.png', cv2.addWeighted(src, .5, aligned_a, .5, 0))
          PY

      - name: Upload alignment diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: bmng-svs-5666-alignment
          path: build
          if-no-files-found: error
          retention-days: 7
