name: Calibrate Northern Algeria smoke transfer

on:
  push:
    branches:
      - render/northern-algeria-20260701-20260901
    paths:
      - '.github/workflows/calibrate-northern-algeria-20260701-20260901.yml'
      - 'renders/northern-algeria-20260701-20260901/calibrate_render.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip
          python -m pip install xarray pydap netCDF4 numpy pandas scipy opencv-python-headless

      - name: Download official NASA SVS 5666 source movie
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          curl --fail --location --retry 5 --retry-all-errors \
            -o build/source.mp4 \
            'https://svs.gsfc.nasa.gov/vis/a000000/a005600/a005666/SmokeIntensity_EuropeanWildfires_082426_1920x1080.mp4'

      - name: Render calibration comparisons
        run: python renders/northern-algeria-20260701-20260901/calibrate_render.py

      - name: Upload calibration package
        uses: actions/upload-artifact@v4
        with:
          name: northern-algeria-smoke-calibration
          path: build/calibration
          if-no-files-found: error
          retention-days: 7
